<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Login - GuruNanak University</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <h1>🎓 GuruNanak University</h1>

            <h2>Student Login</h2>

            <form onsubmit="loginStudent(event)">

                <input
                    type="text"
                    id="studentId"
                    placeholder="Student ID"
                    required
                >

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required
                >

                <button type="submit">
                    Login
                </button>

            </form>

            <p>
                Demo Student ID: <b>student123</b>
            </p>

            <p>
                Demo Password: <b>12345</b>
            </p>

            <a href="index.html">← Back to College Website</a>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
