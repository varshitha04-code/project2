<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Admin Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <h1>🎓 ABC College</h1>

            <h2>Admin Login</h2>


            <form onsubmit="adminLogin(event)">

                <input
                    type="text"
                    id="adminUsername"
                    placeholder="Admin Username"
                    required
                >

                <input
                    type="password"
                    id="adminPassword"
                    placeholder="Password"
                    required
                >

                <button type="submit">
                    Login
                </button>

            </form>


            <p>
                Demo Username: <b>admin</b>
            </p>

            <p>
                Demo Password: <b>admin123</b>
            </p>


            <a href="index.html">
                ← Back to Website
            </a>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
